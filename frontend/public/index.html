<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Smart Content Hub - منصة ذكية لسحب وتحليل والبحث عن المقالات" />
    <meta name="theme-color" content="#667eea" />
    <title>Smart Content Hub | منصة ذكية للمقالات</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%23667eea'>📰</text></svg>" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;700&display=swap" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
            color: #333;
        }

        #root {
            width: 100%;
            min-height: 100vh;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            gap: 30px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .app-title {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: center;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-container">
            <div class="app-title">
                📰
                <span>Smart Content Hub</span>
            </div>
            <div class="spinner"></div>
            <h1>جاري التحميل...</h1>
            <p>منصة ذكية لسحب وتحليل والبحث عن المقالات</p>
        </div>
    </div>

    <!-- React Script - سيتم تحميل التطبيق هنا -->
    <script>
        console.log('Smart Content Hub is loading...');
        console.log('Environment: Development');
        console.log('API Endpoint: http://localhost/api');
    </script>
</body>
</html>
